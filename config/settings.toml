# Configuración del pipeline. Las rutas relativas se resuelven contra la raíz del repo.
# Para cambiar algo sin tocar este archivo: copiarlo a config/settings.local.toml
# (ignorado por git) y apuntar CPA_SETTINGS a esa copia.

[paths]
raw_zip     = "data/raw/cloud_provider_challenge_dataset_v1.zip"
manifest    = "data/landing_manifest.csv"
landing     = "datalake/landing"
bronze      = "datalake/bronze"
silver      = "datalake/silver"
gold        = "datalake/gold"
quarantine  = "datalake/quarantine"
checkpoints = "datalake/_checkpoints"
evidence    = "evidence"

[spark]
app_name           = "cloud-provider-analytics"
master             = "local[*]"
# Con 13 MB de datos, el default de 200 deja cientos de tareas vacías después de cada shuffle.
shuffle_partitions = 8
timezone           = "UTC"

[streaming]
# 120 archivos / 10 = 12 micro-lotes. Ver DECISIONS.md, D-05.
max_files_per_trigger = 10
# Umbral para marcar un evento como tardío (no se descarta). Ver D-06.
late_threshold = "1 hour"

[quality]
# Costo mínimo aceptado por evento. Entre -0,01 y 0 se toma como redondeo (D-04, 7.5).
min_cost_usd = -0.01

[anomaly]
# z robusto (MAD) sobre log(1 + costo diario) por organización y servicio (D-11).
z_threshold = 3.5
# Días mínimos de historia de una organización y servicio para calcular el score.
min_days = 14

[serving]
# Cassandra local (D-09). Si hiciera falta usuario y clave, van en .env, nunca acá.
host = "127.0.0.1"
port = 9042
keyspace = "cloud_analytics"
replication_factor = 1

[genai]
# Precio de referencia para el costo estimado por tokens (DECISIONS.md, D-12), en USD por
# millón de tokens. Los eventos no separan tokens de entrada y salida, así que es un precio
# mezclado: 3 de entrada por 1 de salida en un modelo de gama media a octubre de 2026.
price_usd_per_million_tokens = 2.0
